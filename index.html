<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사이버 샌드위치 말랑이</title>
<meta name="description" content="손, 마우스, 터치로 3D 샌드위치를 꾹꾹 주무르는 말랑이 웹 장난감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* layout: full-bleed 3D stage, floating soft controls at the safe-area edges */
:root{
  --bg:#FFF9F0; --ink:#5B4636; --ink-soft:#9C8573; --chip:#FFFFFF; --chip-line:#F1E2CF;
  --accent:#FF8A7A; --accent-ink:#FFFFFF; --mint:#8EDBB7; --butter:#FFD36E;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.top{position:fixed;top:calc(var(--sat) + 14px);left:calc(var(--sal) + 16px);display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.title{font-family:var(--display);font-size:clamp(18px,2.4vw,24px);letter-spacing:.01em;line-height:1.1}
.title small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:.02em}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meter .bar{width:96px;height:8px;border-radius:99px;background:#F3E6D6;overflow:hidden}
.meter .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--butter),var(--accent),#C9A2FF,var(--mint));background-size:96px 100%;transition:width .3s}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 92px);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--chip-line);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .6s;pointer-events:none;z-index:4}
.hint.fade{opacity:0}
.dock{position:fixed;right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 18px);display:flex;gap:10px;z-index:6}
.btn{font-family:var(--display);font-size:16px;min-height:52px;padding:0 20px;border-radius:99px;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);box-shadow:0 6px 18px rgba(150,110,70,.13);cursor:pointer;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:active{transform:scale(.96)}
.btn .dot{width:10px;height:10px;border-radius:50%;background:#D9C7B3}
.btn.on .dot{background:#38C98A;box-shadow:0 0 0 4px rgba(56,201,138,.2)}
#resetBtn{position:fixed;left:50%;bottom:calc(var(--sab) + 18px);transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:19px;min-height:58px;padding:0 30px;z-index:7;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.cam{position:fixed;top:calc(var(--sat) + 14px);right:calc(var(--sar) + 16px);width:168px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cam .screen{position:relative;width:168px;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#F3E6D6;border:3px solid #fff;box-shadow:0 8px 22px rgba(150,110,70,.18);transition:opacity .25s}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .tag{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(91,70,54,.45);padding:2px 8px;border-radius:99px;transform:none}
.cam.collapsed .screen{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;top:0;right:0;border:0;box-shadow:none}
.mini{font-family:var(--display);font-size:13px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer;touch-action:manipulation}
.cursor{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(255,138,122,.35);box-shadow:0 2px 10px rgba(150,110,70,.25);pointer-events:none;z-index:8;transition:width .12s,height .12s,margin .12s,background .12s}
.cursor.pinch{width:22px;height:22px;margin:-11px 0 0 -11px;background:rgba(255,138,122,.9)}
.cursor.poke{background:rgba(142,219,183,.85)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 76px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:14px;max-width:min(92vw,420px);text-align:center;line-height:1.45;z-index:9;transition:opacity .4s}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--ink-soft);z-index:10;pointer-events:none;transition:opacity .5s}
@media (max-width:600px){
  .cam,.cam .screen{width:112px}
  .cam .screen{border-radius:18px}
  .top{top:calc(var(--sat) + 12px)}
  .hint{bottom:calc(var(--sab) + 88px);font-size:12px}
}
@media (max-height:480px) and (orientation:landscape){
  .cam,.cam .screen{width:120px}
  .hint{bottom:calc(var(--sab) + 80px)}
  .title small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="3D 샌드위치 말랑이 조작 영역"></canvas>

<div class="top">
  <div class="title">사이버 샌드위치 말랑이<small id="sub">꾹 누르고 쭈욱 늘려 보세요</small></div>
  <div class="meter" aria-live="polite"><div class="bar"><div class="fill" id="mixFill"></div></div><span id="mixTxt">섞임 0%</span></div>
</div>

<div class="cam collapsed" id="cam" hidden>
  <div class="screen" id="camScreen">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="lm"></canvas>
    <span class="tag" id="camTag">손을 보여 주세요</span>
  </div>
  <button class="mini" id="camToggle" type="button">미리보기 숨기기</button>
</div>

<div class="hint" id="hint"></div>
<div class="dock"><button class="btn" id="handBtn" type="button"><span class="dot"></span><span id="handLbl">손 인식</span></button></div>
<button class="btn" id="resetBtn" type="button" hidden>다시 만지기</button>
<div class="cursor" id="cur0" hidden></div>
<div class="cursor" id="cur1" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="loading" id="loading">말랑이 꺼내는 중…</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three/three.module.js",
  "three/addons/":"./vendor/three/addons/"
}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const isMobile = isTouch && Math.min(screen.width, screen.height) < 900;

const canvas = $('stage');

/* ---------- global vertex buffers ---------- */
let N = 0, P, V, R0, Q, C, C0, T, PART, LAYER;

function onResize() {
  const w = innerWidth, h = innerHeight;

  camera.aspect = w / h;
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fitW = (isMobile ? 1.1 : 1.45) / (half * camera.aspect);
  const fitH = 1.15 / half;

/* ---------- load model ---------- */

  gltf.scene.updateMatrixWorld(true);
  const parts = [];

  gltf.scene.traverse(o => {
    if (!o.isMesh || !o.visible) return;

    const pos = p.g.attributes.position, gi = groups.indexOf(p.group);

    g.setAttribute('position', new THREE.BufferAttribute(P.subarray(off * 3, (off + p.n) * 3), 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('color', new THREE.BufferAttribute(C.subarray(off * 3, (off + p.n) * 3), 3).setUsage(THREE.DynamicDrawUsage));

    g.attributes.normal.setUsage(THREE.DynamicDrawUsage);

  buildPalette(groups);
  const minY = (box.min.y - ctr.y) * s;
  shadow.position.y = minY - 0.12;
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 600);
  showHint();
}, undefined, err => { $('loading').textContent = '모델을 불러오지 못했어요. 새로고침해 주세요.'; console.error(err); });

/* ---------- color helpers ---------- */
let PALETTE = [];
function buildPalette(groups) {
  const sums = groups.map(() => [0, 0, 0, 0]);
  for (let i = 0; i < N; i++) { const s = sums[PART[i]]; s[0] += C[i * 3]; s[1] += C[i * 3 + 1]; s[2] += C[i * 3 + 2]; s[3]++; }

  const hue = c => { const h = new THREE.Color(c[0], c[1], c[2]).getHSL({}).h; return (h + 0.75) % 1; };

const _hsl = {}, _col = new THREE.Color();
function vivid(c, minS) {

}
const _v3 = [0, 0, 0];
function keepPretty(i) {
  const k = i * 3; _v3[0] = C[k]; _v3[1] = C[k + 1]; _v3[2] = C[k + 2];
  vivid(_v3, 0.36); C[k] = _v3[0]; C[k + 1] = _v3[1]; C[k + 2] = _v3[2];
}
function marbleAt(x, y, z, seed) {
  const f = Math.sin(x * 3.1 + Math.sin(y * 5.3 + z * 2.1 + seed) * 1.8 + z * 1.7) * 0.5 + 0.5;
  const g = Math.sin(z * 4.3 + Math.sin(x * 3.7 - seed) * 1.4 + y * 2.3) * 0.5 + 0.5;

// rounded single-lump shape the clay drifts toward as it is kneaded
const BLOB = [0.86, 0.6, 0.8];

  const k = i * 3; const x = Q[k] / BLOB[0], y = (Q[k + 1] + 0.02) / BLOB[1], z = Q[k + 2] / BLOB[2];

/* ---------- interaction state ---------- */
let mix = 0, mixed = false, finale = null, restoring = 0, touchedOnce = false;
const RP = 0.6, RD = 0.32, RC = 0.3;      // pull radius, dent radius, color radius
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const rootInv = new THREE.Matrix4();
const camDir = new THREE.Vector3();
const contacts = new Map();
let squeeze = null;

function hitModel(x, y) {

function endContact(id) {

function settle(idx, wfn) {

  for (let j = 0; j < idx.length; j++) {

  h.textContent = handsOn ? '검지로 콕 · 엄지+검지로 집어 쭈욱 · 두 손으로 집으면 꾹'
    : isTouch ? '한 손가락으로 꾹·쭈욱 · 두 손가락으로 집기·벌리기 · 빈 곳은 돌리기'
    : '클릭해서 꾹 · 끌어서 쭈욱 · 휠로 양옆에서 꾹 · 빈 곳 드래그로 돌리기';
  h.classList.remove('fade'); clearTimeout(hintTimer);
  hintTimer = setTimeout(fadeHint, 7000);
}
function fadeHint() { if (touchedOnce) $('hint').classList.add('fade'); }
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 400); }, 4200); }
function updateMeter() {
  const pct = mixed ? 100 : Math.min(99, Math.round(mix / 0.8 * 100));
  $('mixFill').style.width = pct + '%';
  $('mixTxt').textContent = mixed ? '완전히 섞였어요' : `섞임 ${pct}%`;
  $('sub').textContent = mixed ? '마블 클레이 완성! 계속 주물러도 돼요' : pct > 50 ? '조금만 더 주물러 볼까요' : '꾹 누르고 쭈욱 늘려 보세요';
}

/* ---------- finale: one marbled lump ---------- */
function startFinale() {
  const tc = new Float32Array(N * 3), tq = new Float32Array(N * 3), seed = Math.random() * 10;
  for (let i = 0; i < N; i++) {
    const k = i * 3, m = marbleAt(R0[k] * 1.7, R0[k + 1] * 1.7, R0[k + 2] * 1.7, seed);
    const u = 0.5 + 0.4 * (1 - Math.min(T[i], 1));
    tc[k] = C[k] + (m[0] - C[k]) * u; tc[k + 1] = C[k + 1] + (m[1] - C[k + 1]) * u; tc[k + 2] = C[k + 2] + (m[2] - C[k + 2]) * u;
    blobTarget(i, _b);
    for (let a = 0; a < 3; a++) tq[k + a] = Q[k + a] + (_b[a] - Q[k + a]) * 0.72;
  }
  finale = { t0: performance.now(), t: 0, fc: C.slice(), fq: Q.slice(), tc, tq };
}

/* ---------- main loop ---------- */
let last = performance.now(), dirtyColor = false, frame = 0, slowTime = 0, mixTimer = 0, normalsTick = 0;
function physics(dt) {
  const k = 120, damp = 9;
  let energy = 0;
  for (let q = 0; q < N * 3; q++) {
    const d = Q[q] - P[q];
    V[q] += (d * k - V[q] * damp) * dt;
    P[q] += V[q] * dt;
    energy += Math.abs(V[q]) + Math.abs(d);
  }
  return energy / (N * 3);
}
let resting = false;
// typed-array normal rebuild (much cheaper than computeVertexNormals on every frame)
function fastNormals(g) {
  const pos = g.attributes.position.array, nor = g.attributes.normal.array, idx = g.index ? g.index.array : null;
  nor.fill(0);
  const tc = idx ? idx.length : pos.length / 3;
  for (let f = 0; f < tc; f += 3) {
    const a = (idx ? idx[f] : f) * 3, b = (idx ? idx[f + 1] : f + 1) * 3, c = (idx ? idx[f + 2] : f + 2) * 3;
    const e1x = pos[b] - pos[a], e1y = pos[b + 1] - pos[a + 1], e1z = pos[b + 2] - pos[a + 2];
    const e2x = pos[c] - pos[a], e2y = pos[c + 1] - pos[a + 1], e2z = pos[c + 2] - pos[a + 2];
    const nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    nor[a] += nx; nor[a + 1] += ny; nor[a + 2] += nz;
    nor[b] += nx; nor[b + 1] += ny; nor[b + 2] += nz;
    nor[c] += nx; nor[c + 1] += ny; nor[c + 2] += nz;
  }
  for (let i = 0; i < nor.length; i += 3) {
    const l = Math.hypot(nor[i], nor[i + 1], nor[i + 2]) || 1;
    nor[i] /= l; nor[i + 1] /= l; nor[i + 2] /= l;
  }
  g.attributes.normal.needsUpdate = true;
}
function tick(now) {
  requestAnimationFrame(tick);
  const rawDt = (now - last) / 1000; last = now;
  const dt = Math.min(rawDt, 1 / 30);
  frame++;
  // adaptive quality
  if (rawDt > 0.03) slowTime += rawDt; else slowTime = Math.max(0, slowTime - rawDt * 0.5);
  if (slowTime > 2 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); onResize(); slowTime = 0; }

  const _t0 = performance.now();
  detectHands(now);
  if (!N) { renderer.render(scene, camera); return; }
  root.updateMatrixWorld(); rootInv.copy(root.matrixWorld).invert();
  updateHands(dt);

  // inertia for view rotation
  if (![...pointers.values()].some(p => p.mode === 'rotate')) {
    root.rotation.y += rotVel.y; root.rotation.x = THREE.MathUtils.clamp(root.rotation.x + rotVel.x, -0.6, 1.2);
    rotVel.y *= 0.92; rotVel.x *= 0.92;
  }

  const active = contacts.size > 0 || squeeze || finale || restoring > 0;
  let e = 1;
  if (active || !resting) {
    const sub = rawDt > 1 / 45 ? 2 : 1;
    for (let s = 0; s < sub; s++) e = physics(dt / sub);
    for (const c of [...contacts.values()]) updateContact(c, dt);
    updateSqueeze(dt);
    resting = !active && e < 2e-5;
    if (finale) {
      finale.t = Math.min(1, (performance.now() - finale.t0) / 1600);
      const u = finale.t * finale.t * (3 - 2 * finale.t);
      for (let q = 0; q < N * 3; q++) { C[q] = finale.fc[q] + (finale.tc[q] - finale.fc[q]) * u; Q[q] = finale.fq[q] + (finale.tq[q] - finale.fq[q]) * u; }
      dirtyColor = true;
      if (finale.t >= 1) finale = null;
    }
    if (restoring > 0) {
      restoring = Math.max(0, 1 - (performance.now() - restoreT0) / 800);
      const u = 1 - restoring, s = u * u * (3 - 2 * u);
      for (let q = 0; q < N * 3; q++) C[q] = restoreFrom[q] + (C0[q] - restoreFrom[q]) * s;
      dirtyColor = true;
    }
    for (const m of meshes) m.geometry.attributes.position.needsUpdate = true;
    normalsTick++;
    const stride = isMobile && !resting ? 2 : 1;
    for (let mi = 0; mi < meshes.length; mi++) if (stride === 1 || (mi + normalsTick) % 2 === 0) fastNormals(meshes[mi].geometry);
  }
  if (dirtyColor) { for (const m of meshes) m.geometry.attributes.color.needsUpdate = true; dirtyColor = false; }

  mixTimer += dt;
  if (mixTimer > 0.25) {
    mixTimer = 0;
    let s = 0; for (let i = 0; i < N; i++) s += T[i] < 1 ? T[i] : 1;
    mix = s / N;
    if (!mixed && mix >= 0.8) { mixed = true; startFinale(); $('resetBtn').hidden = false; }
    updateMeter();
  }
  window.__jsms = performance.now() - _t0;
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
</script>
